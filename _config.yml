title: Freddie Harrison
email: freddie@freddiewrit.es
description: >-
  I’m Freddie Harrison, a writer, accidental marketer and former technology journalist. I lead marketing at Sketch.
url: 'https://freddiewrit.es'
timezone: Europe/London
locale: en_GB
permalink: /journal/:year/:slug/

# SEO & Social
twitter:
  username: freddiewrites
author:
  name: Freddie Harrison
  twitter: freddiewrites
  url: https://freddiewrit.es/about/
social:
  name: Freddie Harrison
  links:
    - https://twitter.com/freddiewrites
    - https://www.linkedin.com/in/fharrison/

# Default social preview image. jekyll-seo-tag only reads `image` from each
# page, so it's set as a default here. A post's own `image:` replaces it.
defaults:
  - scope:
      path: ""
    values:
      image:
        path: /assets/images/social-image.png
        width: 1200
        height: 630
        alt: The fh marque in white on a plum background

# Build settings
markdown: kramdown

# Repository files that shouldn't be published. Jekyll adds these to its
# own defaults (Gemfile, vendor and so on).
exclude:
  - README.md
  - AGENTS.md
  - CLAUDE.md
  - scripts/
  # Elyx design files
  - elyx.json
  - tokens/
  - blocks/
  - controls/
  - screens/
  - resources/

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-archives

jekyll-archives:
  enabled:
    - categories
  layout: tag
  permalinks:
    category: /tags/:name/

sass:
  sass_dir: _sass
  style: compressed
