---
layout: default
---
<div class="home">
  <section class="intro">
    {{ content }}
  </section>

  <hr class="home-divider">

  <section class="latest" aria-labelledby="latest-heading">
    <h2 id="latest-heading" class="section-label">Latest post</h2>
    {% include visible-posts.html %}
    {% for post in visible_posts limit: 1 %}
      <article class="latest-post">
        <h3 class="latest-post-title"><a href="{{ post.url | relative_url }}">{{ post.title }}</a></h3>
        <time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%-d %B %Y" }}</time>
        {% if post.excerpt %}<p class="latest-post-excerpt">{{ post.excerpt | strip_html | strip }}</p>{% endif %}
      </article>
    {% endfor %}

    <a href="/posts/" class="all-posts-link">All posts &rarr;</a>
  </section>
</div>
