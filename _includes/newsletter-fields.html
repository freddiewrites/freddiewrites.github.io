{% comment %}
  Newsletter signup fields and their script. Posts to Buttondown.
  Used inside the home page panel and on /newsletter/.
{% endcomment %}
<form class="newsletter-form" action="https://buttondown.com/api/emails/embed-subscribe/freddiewrites" method="post" target="_blank">
  <div class="newsletter-field">
    <label for="newsletter-first-name">First name</label>
    <input type="text" id="newsletter-first-name" name="metadata__first_name" autocomplete="given-name" required aria-describedby="newsletter-first-name-error">
    <p class="newsletter-error" id="newsletter-first-name-error" hidden></p>
  </div>
  <div class="newsletter-field">
    <label for="newsletter-email">Email</label>
    <input type="email" id="newsletter-email" name="email" autocomplete="email" required aria-describedby="newsletter-email-error">
    <p class="newsletter-error" id="newsletter-email-error" hidden></p>
  </div>
  <input type="hidden" name="embed" value="1">
  <button type="submit" class="newsletter-button">Subscribe</button>
  <p class="newsletter-status" role="status"></p>
</form>
<script src="{{ '/assets/js/newsletter.js' | relative_url }}" defer></script>
